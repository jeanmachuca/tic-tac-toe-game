<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <div class="parallax-bg" id="parallaxBg"></div>
  <div class="overlay"></div>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">TIC-TAC-TOE</a>
    <div class="nav-right">
      <span id="userDisplay" class="user-display"></span>
      <div id="loginContainer"></div>
    </div>
  </nav>

  <main class="game-wrapper">
    <div class="game-container">
      <div class="status" id="status">Player X's turn</div>
      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
        <div class="win-line" id="winLine"></div>
      </div>
      <div class="scoreboard">
        <div class="score-item"><span class="score-val wins" id="scoreWins">0</span><span class="score-lbl">Wins</span></div>
        <div class="score-item"><span class="score-val losses" id="scoreLosses">0</span><span class="score-lbl">Losses</span></div>
        <div class="score-item"><span class="score-val draws" id="scoreDraw">0</span><span class="score-lbl">Draws</span></div>
      </div>
      <button class="btn-new" id="resetBtn">New Game</button>
    </div>
  </main>

  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="auth.js"></script>
  <script src="profile.js"></script>
  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
